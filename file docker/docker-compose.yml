services:
  app:
    build: .
    container_name: newsis-container
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - .:/var/www/html
    networks:
      - laravel-net
      - webproxy

  nginx-internal:
    image: nginx:alpine
    container_name: nginx-newsis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-net
      - webproxy
    depends_on:
      - app

networks:
  laravel-net:
  webproxy:
    external: true
